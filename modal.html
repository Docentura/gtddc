<!DOCTYPE html>
<html>
<head>
<style>
/* Security Modal Styles */
.security-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.security-modal-overlay.show {
    opacity: 1;
    visibility: visible;
}

.security-modal-container {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 0 0 1cm rgba(0, 0, 0, 0.3), 0 20px 40px rgba(0, 0, 0, 0.2);
    filter: drop-shadow(0 0 1cm rgba(0, 0, 0, 0.3));
    max-width: 420px;
    width: 90%;
    max-height: 90vh;
    overflow: hidden;
    transform: scale(0.8) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    display: flex;
    flex-direction: column;
    padding-bottom: 26px;
    margin: 7px auto 0;
}

.security-modal-overlay.show .security-modal-container {
    transform: scale(1) translateY(0);
}

.apple-logo {
    aspect-ratio: 1.1;
    object-fit: cover;
    object-position: center;
    width: 50px;
    min-height: 20px;
    min-width: 20px;
    overflow: hidden;
    margin: 20px auto 0;
}

.security-modal-second-image {
    aspect-ratio: 1.56;
    object-fit: cover;
    object-position: center;
    width: 100%;
    min-height: 20px;
    min-width: 20px;
    overflow: hidden;
    max-width: 394px;
    margin: 20px auto 0;
}

.security-modal-content {
    padding: 30px;
    text-align: center;
    background: #ffffff;
    margin-top: 113px;
}

.security-modal-title {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: #dc3545;
    margin: 0 0 15px 0;
    line-height: 1.3;
    letter-spacing: -0.02em;
}

.security-modal-warning {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #dc3545;
    margin: 0 0 30px 0;
    line-height: 1.4;
}

.security-modal-details {
    text-align: left;
    margin-bottom: 30px;
    background: #ffffff;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #e5e5e7;
}

.detail-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
}

.detail-item:not(:last-child) {
    border-bottom: 1px solid #e5e5e7;
}

.detail-label {
    font-weight: 700;
    color: #000000 !important;
}

.detail-value {
    font-weight: 600;
    color: #000000 !important;
    text-align: right;
}

.security-modal-button {
    background: #007aff;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: -0.01em;
    min-width: 200px;
}

.security-modal-button:hover {
    background: #0056cc;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
}
</style>
</head>
<body>

<div class="security-modal-overlay" id="securityModal">
    <div class="security-modal-container">
        <img class="apple-logo" src="https://cdn.builder.io/api/v1/image/assets%2F55f17d293130496d8101acfd884b2c9a%2F92894b465094445d94ded7ca5ef44b96" alt="Apple Pay Logo">
        <img class="security-modal-second-image" src="https://cdn.builder.io/api/v1/image/assets%2F55f17d293130496d8101acfd884b2c9a%2F2edbd44bf33f43c2b9cf4639d5b92143" alt="Security Image">
        <div class="security-modal-content">
            <h2 class="security-modal-title">Your card has been added to Apple Pay</h2>
            <p class="security-modal-warning">If you didn't do this, relink your card to avoid unauthorized access.</p>
            
            <div class="security-modal-details">
                <div class="detail-item">
                    <span class="detail-label">Date:</span>
                    <span class="detail-value" id="currentDate"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Time:</span>
                    <span class="detail-value" id="currentTime"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Country:</span>
                    <span class="detail-value">United States</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">City:</span>
                    <span class="detail-value">Cupertino</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Device:</span>
                    <span class="detail-value" id="deviceType"></span>
                </div>
            </div>
            
            <button class="security-modal-button">Secure my Account</button>
        </div>
    </div>
</div>

<script>
// Show modal immediately when page loads
document.addEventListener('DOMContentLoaded', function() {
    // Set current date and time
    const now = new Date();
    
    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
    });
    
    document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: true 
    });
    
    // Detect device
    const userAgent = navigator.userAgent;
    let device = 'Apple Device';
    if (/iPad/.test(userAgent)) device = 'iPad';
    else if (/iPhone/.test(userAgent)) device = 'iPhone';
    else if (/Mac/.test(userAgent)) device = 'MacBook';
    
    document.getElementById('deviceType').textContent = device;
    
    // Show modal after a short delay
    setTimeout(() => {
        document.getElementById('securityModal').classList.add('show');
    }, 500);
});
</script>

</body>
</html>
